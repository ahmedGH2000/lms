# Include inside your existing Frappe server {}. Change upstream name to match bench.
# Mount the private media tree here, readable by the nginx worker.
location ~ "^/_nj_media/([a-f0-9]{32})/(segment_[0-9]{5}\.ts)$" {
    internal;
    alias /var/lib/nightjar/media/$1/$2;
    default_type video/mp2t;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}
location /_nj_media/ { return 404; }
location = /api/method/nightjar_learning.video.resource {
    proxy_pass http://frappe;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    access_log off;
}
